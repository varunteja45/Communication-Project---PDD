name: aeccde_app
description: "Automatic Evaluation of Communication Competency in Diverse Environments (AECCDE) - an on-device speech & NLP powered coaching app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Speech capture & recognition
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  camera: ^0.11.0+2

  # Local persistence
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Visuals
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  animate_do: ^3.3.4
  lottie: ^3.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  share_plus: ^10.0.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
